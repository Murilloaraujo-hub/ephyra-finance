<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ephyra Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="./css/style.css?v=20260821v4">
<style>
:root{--cp:#7c3aed;--cl:#a78bfa;--cs:#1e40af;--cg:#10b981;--cr:#ef4444;--cw:#f59e0b;--cy:#fbbf24;--rm:12px;--rl:16px;--rx:24px}
.dark{--bg:#0a0e1a;--bg2:#111827;--bgc:rgba(17,24,39,.7);--bgs:#1a2236;--bgi:#1e293b;--bgh:rgba(124,58,237,.12);--tp:#f1f5f9;--ts:#94a3b8;--tm:#64748b;--bc:rgba(148,163,184,.12);--gb:rgba(17,24,39,.55)}
.light{--bg:#f8fafc;--bg2:#f1f5f9;--bgc:rgba(255,255,255,.85);--bgs:#fff;--bgi:#e2e8f0;--bgh:rgba(124,58,237,.08);--tp:#0f172a;--ts:#475569;--tm:#94a3b8;--bc:rgba(15,23,42,.08);--gb:rgba(255,255,255,.6)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;line-height:1.6;color:var(--tp);background:var(--bg);overflow-x:hidden;transition:background .4s,color .4s}
input,button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}ul{list-style:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--cp);border-radius:8px}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes su{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes si{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}@keyframes sl{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes lu{0%{transform:scale(1)}25%{transform:scale(1.15)}50%{transform:scale(1);box-shadow:0 0 20px var(--cp)}100%{transform:scale(1)}}
.aFi{animation:fi .4s ease both}.aSu{animation:su .5s ease both}.aSi{animation:si .35s ease both}.aL{animation:lu .8s ease}
#auth-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#auth-screen.hidden{opacity:0;pointer-events:none;display:none!important}
.auth-container{width:100%;max-width:440px;padding:2rem}
.auth-brand{text-align:center;margin-bottom:2rem}
.auth-brand .logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--cp),var(--cs));display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;margin:0 auto 1rem}
.auth-brand h1{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,var(--cp),var(--cl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-brand p{color:var(--tm);margin-top:.5rem;font-size:.9rem}
.auth-tabs{display:flex;gap:.25rem;padding:.3rem;background:var(--bg2);border-radius:var(--rm);margin-bottom:2rem}
.auth-tab{flex:1;padding:.7rem;text-align:center;border-radius:var(--rm);font-weight:600;font-size:.9rem;transition:.3s;cursor:pointer;color:var(--tm)}
.auth-tab.active{background:var(--cp);color:#fff}
.auth-panel{display:none;animation:fi .4s ease both}.auth-panel.active{display:block}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8rem;font-weight:600;color:var(--ts);margin-bottom:.4rem}
.form-input{width:100%;padding:.75rem 1rem;border-radius:var(--rm);border:1.5px solid var(--bc);background:var(--bgi);color:var(--tp);transition:.15s;font-size:.9rem}
.form-input:focus{outline:none;border-color:var(--cp);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.form-input.err{border-color:var(--cr)}
.form-error{font-size:.75rem;color:var(--cr);margin-top:.3rem;display:none}
.form-error.show{display:block}
.input-wrap{position:relative}
.input-wrap .toggle-pw{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);color:var(--tm);cursor:pointer;font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:var(--rm);font-weight:600;font-size:.9rem;transition:.3s;white-space:nowrap;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--cp),var(--cs));color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(124,58,237,.35)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:2px solid var(--cp);color:var(--cp)}
.btn-success{background:var(--cg);color:#fff}.btn-danger{background:var(--cr);color:#fff}
.btn-ghost{background:transparent;color:var(--ts)}.btn-ghost:hover{background:var(--bgh);color:var(--cp)}
.btn-sm{padding:.45rem .9rem;font-size:.8rem}.btn-lg{padding:.9rem 2rem;font-size:1rem}.btn-bk{width:100%}
.avatar-upload{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-bottom:1.5rem}
.avatar-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--cp);cursor:pointer;transition:.3s}
.avatar-initials{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--cp),var(--cs));display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;border:3px solid var(--cp);cursor:pointer;transition:.3s}
#toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:99999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.85rem 1.2rem;border-radius:var(--rm);font-size:.875rem;font-weight:500;display:flex;align-items:center;gap:.6rem;animation:sl .35s ease both;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:380px;border-left:4px solid;background:var(--bgs);color:var(--tp)}
.toast.s{border-color:var(--cg)}.toast.e{border-color:var(--cr)}.toast.i{border-color:var(--cp)}
.toast.out{opacity:0;transition:.3s}
#ldr{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;transition:opacity .5s}
#ldr.fo{opacity:0;pointer-events:none}.ld{width:48px;height:48px;border:4px solid var(--bc);border-top-color:var(--cp);border-radius:50%;animation:spin .8s linear infinite}
/* APP SHELL - NEW SIDEBAR INTELIGENTE */
.app{display:flex;min-height:100vh}
.sidebar{width:72px;background:var(--bg2);border-right:1px solid var(--bc);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:300;transition:width .35s cubic-bezier(0.4,0,0.2,1),box-shadow .3s;overflow:visible}
.sidebar:hover,.sidebar.expanded{width:260px;box-shadow:0 0 30px rgba(0,0,0,.3)}
.sb-brand{display:flex;align-items:center;gap:.75rem;padding:1.25rem 1rem;border-bottom:1px solid var(--bc);min-height:72px}
.sb-icon{width:42px;height:42px;border-radius:var(--rm);background:linear-gradient(135deg,var(--cp),var(--cs));display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;flex-shrink:0;transition:.3s}
.sb-title{font-size:1.05rem;font-weight:800;background:linear-gradient(135deg,var(--cp),var(--cl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;opacity:0;transform:translateX(-10px);transition:opacity .25s,transform .25s;pointer-events:none}
.sidebar:hover .sb-title,.sidebar.expanded .sb-title{opacity:1;transform:translateX(0);pointer-events:all}
.sb-money-trigger{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem 0;transition:opacity .25s,height .35s,padding .35s;cursor:pointer;color:var(--ts)}
.sb-money-trigger:hover{color:var(--cp)}
.sb-money-trigger .money-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(30,64,175,.1));display:flex;align-items:center;justify-content:center;font-size:2rem;transition:.3s;border:1px solid var(--bc)}
.sb-money-trigger:hover .money-icon{transform:scale(1.08);box-shadow:0 0 20px rgba(124,58,237,.25);background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(30,64,175,.15))}
.sb-money-trigger .money-text{font-size:.75rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.sidebar:hover .sb-money-trigger,.sidebar.expanded .sb-money-trigger{opacity:0;height:0;padding:0;overflow:hidden;pointer-events:none}
.sb-nav{display:flex;flex-direction:column;gap:.25rem;padding:1rem .75rem;flex:1;opacity:0;transform:translateX(-15px);pointer-events:none;transition:opacity .3s .05s,transform .3s .05s}
.sidebar:hover .sb-nav,.sidebar.expanded .sb-nav{opacity:1;transform:translateX(0);pointer-events:all}
.ni{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;border-radius:var(--rm);font-size:.875rem;font-weight:500;color:var(--ts);transition:.15s;cursor:pointer;white-space:nowrap}
.ni i{width:20px;text-align:center;flex-shrink:0}
.ni:hover{background:var(--bgh);color:var(--cp)}
.ni.a{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(30,64,175,.1));color:var(--cp);font-weight:600}
.ni span{opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .2s}
.sidebar:hover .ni span,.sidebar.expanded .ni span{opacity:1;transform:translateX(0)}
.sidebar:not(:hover):not(.expanded) .sb-nav .ni{justify-content:center;padding:.7rem}
.sb-footer{padding:1rem .75rem;border-top:1px solid var(--bc);display:flex;flex-direction:column;gap:.5rem}
.sb-gear{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;border-radius:var(--rm);color:var(--ts);width:100%;transition:.15s;cursor:pointer;white-space:nowrap}
.sb-gear:hover{background:var(--bgh);color:var(--cp)}
.sb-gear i{width:20px;text-align:center;flex-shrink:0}
.sb-gear .gear-text{opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .2s;font-size:.875rem;font-weight:500}
.sidebar:hover .sb-gear .gear-text,.sidebar.expanded .sb-gear .gear-text{opacity:1;transform:translateX(0)}
.sidebar:not(:hover):not(.expanded) .sb-gear{justify-content:center;padding:.7rem}
.sidebar:not(:hover):not(.expanded) .sb-gear .gear-text{display:none}
.sb-summary{position:relative}
.sb-summary::after{content:attr(data-tooltip);position:absolute;left:calc(100% + .65rem);top:50%;transform:translateY(-50%) translateX(-.35rem);padding:.38rem .6rem;border:1px solid var(--bc);border-radius:.5rem;background:var(--bgs);color:var(--tp);font-size:.68rem;font-weight:650;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.25)}
.sb-summary:hover::after,.sb-summary:focus-visible::after{opacity:1;transform:translateY(-50%) translateX(0)}
.sp{display:flex;align-items:center;gap:.75rem;padding:.5rem;border-radius:var(--rm);cursor:pointer;transition:.15s;white-space:nowrap}
.sp:hover{background:var(--bgh)}
.spi{flex:1;min-width:0;opacity:0;transform:translateX(-8px);transition:opacity .25s .05s,transform .25s .05s}
.sidebar:hover .spi,.sidebar.expanded .spi{opacity:1;transform:translateX(0)}
.spn{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl{font-size:.7rem;color:var(--tm)}
.sidebar:not(:hover):not(.expanded) .sp{justify-content:center;padding:.5rem}
.sb-profile-avatar{flex-shrink:0}
.main{flex:1;margin-left:72px;min-height:100vh;display:flex;flex-direction:column;transition:margin-left .35s}
.topbar{height:64px;background:rgba(17,24,39,.55);backdrop-filter:blur(12px);border-bottom:1px solid var(--bc);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:200}
.tb-left{display:flex;align-items:center;gap:1rem}.tb-title{font-size:1.15rem;font-weight:700}
.tb-right{display:flex;align-items:center;gap:.75rem}
.menu-btn{display:none;width:40px;height:40px;border-radius:var(--rm);align-items:center;justify-content:center;font-size:1.2rem;color:var(--tp)}
.sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299}
.sov.a{display:block}
.page{display:none;padding:2rem;animation:fi .4s ease both}.page.a{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.pt{font-size:1.5rem;font-weight:800}.psub{color:var(--tm);font-size:.85rem;margin-top:.2rem}
.card{background:var(--bgc);border:1px solid var(--bc);border-radius:var(--rl);padding:1.5rem;transition:.3s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bh{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(30,64,175,.08));border:1px solid var(--bc);border-radius:var(--rx);padding:2rem;position:relative;overflow:hidden}
.bh::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cp),var(--cs),var(--cl))}
.bl2{font-size:.8rem;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.ba{font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,var(--cp),var(--cl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:.25rem 0}
.bsu{display:flex;gap:2rem;flex-wrap:wrap}.bsi{display:flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.sc{display:flex;align-items:center;gap:1rem;padding:1.2rem;border-radius:var(--rl);background:var(--bgc);border:1px solid var(--bc);transition:.3s}
.sc:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.si{width:48px;height:48px;border-radius:var(--rm);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.sv{font-size:1.35rem;font-weight:800;line-height:1.2}.sl{font-size:.75rem;color:var(--tm);text-transform:uppercase;letter-spacing:.4px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.5rem}
.cc{background:var(--bgc);border:1px solid var(--bc);border-radius:var(--rl);padding:1.5rem}
.ct2{font-size:1rem;font-weight:700;margin-bottom:1rem}
.cw{position:relative;height:280px}.cw canvas{width:100%!important;height:100%!important}
.tl2{display:flex;flex-direction:column;gap:.5rem}
.ti2{display:flex;align-items:center;gap:1rem;padding:.9rem 1rem;border-radius:var(--rm);background:var(--bgc);border:1px solid var(--bc);transition:.15s}
.ti2:hover{background:var(--bgh);border-color:var(--cp)}
.tic{width:42px;height:42px;border-radius:var(--rm);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.tin{flex:1;min-width:0}.tnm{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmt{font-size:.75rem;color:var(--tm)}.ta2{font-weight:700;font-size:.95rem;white-space:nowrap}
.tac{display:flex;gap:.3rem}.tac .bi2{width:32px;height:32px;font-size:.8rem;border-radius:6px;color:var(--tm);display:flex;align-items:center;justify-content:center}
.tac .bi2:hover{background:var(--bgh);color:var(--cp)}
.prog{width:100%;height:10px;background:var(--bgi);border-radius:9999px;overflow:hidden}
.prog-fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--cp),var(--cl));transition:width .6s ease}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid var(--cp);flex-shrink:0}
.av-sm{width:36px;height:36px;border-width:2px}.av-xl{width:110px;height:110px;border-width:4px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:.3s;padding:1rem}
.mo.a{opacity:1;pointer-events:all}
.md{background:var(--bgs);border:1px solid var(--bc);border-radius:var(--rx);padding:2rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;transform:scale(.9) translateY(20px);transition:.3s}
.mo.a .md{transform:scale(1) translateY(0)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.mt2{font-size:1.25rem;font-weight:700}
.mc{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bgh);color:var(--ts);transition:.15s}
.mc:hover{background:var(--cr);color:#fff}
.mbd{display:flex;flex-direction:column;gap:1rem}.mf2{display:flex;gap:.75rem;margin-top:1.5rem;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;padding:.2rem .7rem;border-radius:9999px;font-size:.7rem;font-weight:700}
.bdp{background:rgba(124,58,237,.15);color:var(--cp)}.bds{background:rgba(16,185,129,.15);color:var(--cg)}.bdd{background:rgba(239,68,68,.15);color:var(--cr)}
.es{text-align:center;padding:3rem 1rem}.es .ei{font-size:3.5rem;margin-bottom:1rem;opacity:.5}.es h3{font-size:1.1rem;margin-bottom:.5rem}.es p{color:var(--tm);font-size:.9rem;margin-bottom:1.5rem}
.ga{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.flx{display:flex}.fc{flex-direction:column}.aic{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}
.gs{gap:.5rem}.gm{gap:1rem}.gl{gap:1.5rem}
.tc2{text-align:center}.tm2{color:var(--tm)}.ts2{color:var(--ts)}.tg{color:var(--cg)}.td{color:var(--cr)}.tc{color:var(--cp)}
.f6{font-weight:600}.f7{font-weight:700}.f8{font-weight:800}
.txm{font-size:.875rem}.txs{font-size:.75rem}.txl{font-size:1.25rem}.txx{font-size:1.5rem}
.bn{display:none;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(17,24,39,.55);backdrop-filter:blur(16px);border-top:1px solid var(--bc);z-index:200;align-items:center;justify-content:space-around;padding:0 .5rem}
.bni{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.4rem .6rem;border-radius:6px;color:var(--tm);font-size:.65rem;font-weight:600;transition:.15s}
.bni i{font-size:1.15rem}.bni.a{color:var(--cp)}
.pf-cover{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(30,64,175,.1));border-radius:var(--rx);padding:2rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.pf-cover::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cp),var(--cs),var(--cl))}
.pf-avatar-wrap{position:relative;display:inline-block}
.pf-avatar-edit{position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--cp);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;border:2px solid var(--bg2)}
/* RESUMO FINANCEIRO - PAGINA COMPLETA */
.financial-summary-page{display:flex;flex-direction:column;gap:2rem;padding-bottom:4rem}
.financial-summary-header{display:grid;grid-template-columns:minmax(0,1fr) minmax(16rem,26rem);align-items:center;gap:2rem;padding:clamp(1.25rem,3vw,2rem);border:1px solid var(--bc);border-radius:var(--rx);background:linear-gradient(135deg,rgba(124,58,237,.13),rgba(30,64,175,.08));overflow:hidden;position:relative}
.financial-summary-header::after{content:'';position:absolute;width:18rem;height:18rem;border-radius:50%;right:-8rem;top:-10rem;background:radial-gradient(circle,rgba(124,58,237,.3),transparent 70%);pointer-events:none}
.financial-summary-header h1{font-size:clamp(1.65rem,3vw,2.4rem);font-weight:850;letter-spacing:-.035em}.financial-summary-header p{color:var(--ts);max-width:48rem;margin-top:.45rem;font-size:.9rem}
.financial-summary-ephyra{display:flex;align-items:center;gap:.85rem;padding:1rem;border:1px solid rgba(124,58,237,.2);border-radius:var(--rl);background:rgba(15,23,42,.24);backdrop-filter:blur(12px);position:relative;z-index:1}
.financial-summary-ephyra-mark{width:3rem;height:3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cp),var(--cs));font-weight:900;color:#fff;flex-shrink:0}.financial-summary-ephyra small{display:block;color:var(--cl);font-weight:800;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}.financial-summary-ephyra p{font-size:.75rem;margin:0;color:var(--ts)}
.summary-history-section h2{font-size:1.05rem;margin-bottom:.85rem}.summary-history-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(13rem,17rem);gap:.8rem;overflow-x:auto;padding:.15rem .1rem .75rem;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--cp) transparent}

const marketCodes=Market?.cache ? [...Object.keys(Market.cache.fiat||{}),...Object.keys(Market.cache.crypto||{})] : ['USD','EUR','GBP','BTC','ETH'];
this.oM(`${isE?'Editar':'Nova'} ${tipo==='receita'?'Receita':'Despesa'}`,`
<form id="txf" class="fc gm">
<div class="fg"><label class="form-label">Nome *</label><input class="form-input" id="txn" required value="${U.esc(existing?.nome||'')}"></div>

U.on(U.qs('#txf'),'submit',e=>{
e.preventDefault();
const isIntl=U.qs('#tx-intl').checked;
let nome=U.qs('#txn').value.trim(),categoria=U.qs('#txc').value,valor=parseFloat(U.qs('#txv').value),data=U.qs('#txd').value,desc=U.qs('#txds').value;
if(!nome||!Number.isFinite(valor)||valor<=0){Toast.e('Preencha o nome e valor corretamente');return}
const parsedDate = data ? new Date(data + 'T12:00:00.000Z') : new Date();
if (Number.isNaN(parsedDate.getTime())) { Toast.e('Data inválida'); return; }
const dtIso = parsedDate.toISOString();
const cat=(this.data.categorias||[]).find(c=>c.id===categoria);
let extra={};
if(isIntl){
const origCur=U.qs('#tx-orig-cur').value;
const origVal=parseFloat(U.qs('#tx-orig-val').value);
if(!origCur||!Number.isFinite(origVal)||origVal<=0){Toast.e('Preencha a moeda e o valor original corretamente');return}
const converted=MarketAPI.convert(origVal,origCur,localCurr,Market?.cache);
if(converted===null){Toast.e('Conversão indisponível');return}
valor=converted;
extra={moedaOriginal:origCur,valorOriginal:origVal,taxaConversao:converted/origVal,valorConvertido:converted};
}
if(isE){
const lists=[this.data.receitas,this.data.despesas,this.data.historico];
for(const l of lists){const i=l.findIndex(t=>t.id===editId);if(i>=0){const old=l[i];const diff=valor-old.valor;if(old.tipo==='receita')this.data.saldo+=diff;else this.data.saldo-=diff;Object.assign(l[i],{nome,categoria,valor,data:dtIso,descricao,categoriaObj:cat,...extra});}}
Toast.s('Atualizada!');
}else{
const tx={id:U.id(),tipo,nome,categoria,categoriaObj:cat,valor,data:dtIso,descricao,DataCriacao:new Date().toISOString(),...extra};

this.data.historico.push(tx);
this.addXP(5);

}
this.saveData();this.checkAchievements();this.cMo();this.nav(this.cp);
});

updateIntlPreview(){
const origCur=U.qs('#tx-orig-cur')?.value;
const origVal=parseFloat(U.qs('#tx-orig-val')?.value);
const localCurr=this.data.market?.defaultCurrency||this.data.config?.moeda||'BRL';
const preview=U.qs('#tx-intl-preview');
const valInput=U.qs('#txv');
if(!origCur||!origVal||!preview) return;
const converted=MarketAPI.convert(origVal,origCur,localCurr,Market?.cache);
if(converted!==null){
preview.textContent=`≈ ${U.money(converted)} • Taxa: 1 ${origCur} = ${(converted/origVal).toFixed(4)} ${localCurr}`;
if(valInput) valInput.value=converted.toFixed(2);
}else{
preview.textContent='Conversão indisponível offline — usando última cotação';

checkAchievements(){
const d=this.data;const unlock=def=>{if(d.conquistas.some(c=>c.id===def.id))return;d.conquistas.push({...def,data:new Date().toISOString(),desbloqueada:true});d.xp=(d.xp||0)+def.xp;Toast.s(`🏆 ${def.nome}!`);this.saveData();};
const h=d.historico||[],r=d.receitas||[],ds=d.despesas||[],m=d.metas||[],dia=d.config?.diasUsando||1;
if(r.length>=1)unlock(this.ACH_DEF[0]);if(ds.length>=1)unlock(this.ACH_DEF[1]);if(m.length>=1)unlock(this.ACH_DEF[2]);

changeProfilePhoto(input){
const file=input.files[0];if(!file)return;
if(!['image/jpeg','image/jpg','image/png','image/webp'].includes(file.type)){Toast.e('Formato inválido. Use JPG, PNG ou WEBP.');return}
if(file.size>5*1024*1024){Toast.e('Máximo: 5MB');return}
const reader=new FileReader();
reader.onload=ev=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
const ctx=canvas.getContext('2d');const minD=Math.min(img.width,img.height);
ctx.drawImage(img,(img.width-minD)/2,(img.height-minD)/2,minD,minD,0,0,256,256);
const dataUrl=canvas.toDataURL('image/jpeg',0.7);
this.user.foto=dataUrl;this.data.user.foto=dataUrl;
Auth.updateUser({foto:dataUrl});this.saveData();this.updProf();
Toast.s('Foto atualizada!');this.nav('perfil');
};img.src=ev.target.result;
};reader.readAsDataURL(file);
},
editProf(){
this.oM('Editar Perfil',`
<form id="pf" class="fc gm">
<div class="fg"><label class="form-label">Nome</label><input class="form-input" id="pn" value="${U.esc(this.user.nome)}"></div>
<div class="fg"><label class="form-label">Email</label><input class="form-input" id="pe" type="email" value="${U.esc(this.user.email)}"></div>
<button type="submit" class="btn btn-primary bb">Salvar</button>
</form>`);
U.on(U.qs('#pf'),'submit',async e=>{
e.preventDefault();
const nome=U.qs('#pn').value.trim();const email=U.qs('#pe').value.trim().toLowerCase();
if(!nome){Toast.e('Nome obrigatório');return}
if(!email||!Auth.validEmail(email)){Toast.e('Email inválido');return}
try{
if(email!==this.user.email){
const users=await Auth.getUsers();
if(users[email]){Toast.e('Email já em uso');return}
const oldEmail=this.user.email;
const data=await EphyraStorage.getUserData(oldEmail);
delete users[oldEmail];
this.user.email=email;this.user.nome=nome;
users[email]=this.user;
await Auth.saveUsers(users);
if(data) await EphyraStorage.saveUserData(email,data);
await EphyraStorage.removeUserData(oldEmail);
await Auth.saveSession({email,remember:true});
}
await Auth.updateUser({nome,email});
this.user.nome=nome;this.user.email=email;this.data.user.nome=nome;this.data.user.email=email;
this.saveData();Toast.s('Perfil atualizado!');this.cMo();this.updProf();
if(this.cp==='perfil') this.rPerfil();
}catch(err){console.error(err);Toast.e('Erro ao atualizar perfil')}
});
},

setCurrency(cur){
if(!this.data.market) this.data.market={favorites:[],alerts:[],defaultCurrency:cur};
this.data.market.defaultCurrency=cur;
this.data.config.moeda=cur;
this.saveData();
if(typeof Market!=='undefined'){Market.setDefaultCurrency(cur);}
Toast.s(`Moeda padrão: ${cur}`);
},
expData(){
(async()=>{
try{
const j=await EphyraStorage.exportAll(this.user.email);
const b=new Blob([j],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ephyra-backup.json';a.click();URL.revokeObjectURL(a.href);Toast.s('Dados exportados!');
}catch(err){Toast.e('Erro ao exportar')}
})();
},
impData(e){
const f=e.target.files[0];if(!f) return;
const r=new FileReader();
r.onload=async(ev)=>{
try{
const obj=JSON.parse(ev.target.result);
if(obj.data){
await EphyraStorage.importAll(this.user.email,obj);
this.data=await EphyraStorage.getUserData(this.user.email);
this.user=await EphyraStorage.getUser(this.user.email)||this.user;
this.updProf();this.nav(this.cp);Toast.s('Dados importados!');
}else Toast.e('Formato inválido');
}catch(err){console.error(err);Toast.e('Erro na importação')}
};r.readAsText(f);
},
cReset(){
this.oM('⚠️ Resetar Tudo',`<p class="ts2">Todos os dados serão perdidos permanentemente. Continuar?</p>
<div class="mf2"><button class="btn btn-ghost" onclick="App.cMo()">Cancelar</button><button class="btn btn-danger" id="rB">Resetar</button></div>`);
U.on(U.qs('#rB'),'click',async()=>{
try{
await EphyraStorage.removeUserData(this.user.email);
await Auth.clearSession();
await Auth.logout();
}catch(err){console.error(err);Toast.e('Erro ao resetar')}
});
},
oM(title,body){U.qs('#m-title').textContent=title;U.qs('#m-body').innerHTML=body;U.qs('#modal').classList.add('a')},
cMo(){U.qs('#modal').classList.remove('a')}
